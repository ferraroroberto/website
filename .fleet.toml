# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "working-web"
icon        = "🌐"
description = "Multi-workshop landing site."
shape       = "static-site"
# Root folders beyond the static-site preset (css, js, assets, games): the per-workshop
# config, the per-workshop content data, the two image folders the pages load by
# relative path, and the gate scripts. docs/layout.md describes each.
extra_roots = ["config", "data", "illustrations", "images", "scripts"]

# [vendored] -- components copied byte-for-byte from project-scaffolding, with the
# scaffold commit each came from. Re-vendor through /propagate-vendored, never by hand.
[vendored]
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/structure_ratchet.py" }
structure_layout = { src = "scripts/structure_layout.py", sha = "f272f4fbcfb5a5064c918e24a7898b0b34343212", dest = "scripts/structure_layout.py" }
structure_band = { src = "scripts/structure_band.py", sha = "3b708fd3c54ab7b93b08d489406c405762c83c41", dest = "scripts/structure_band.py" }
box_lock_gate = { src = "scripts/box_lock_gate.ps1", sha = "98cdb1b7727d12a5c233580478e6fae40d98e6f3", dest = "scripts/box_lock_gate.ps1" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/instruction_ratchet.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/doc_refs_ratchet.py" }
static_ratchet = { src = "scripts/static_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/static_ratchet.py" }
docs_ratchet = { src = "scripts/docs_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/docs_ratchet.py" }
comment_ratchet = { src = "scripts/comment_ratchet.py", sha = "41ca8abd5a2755a06bd8a620a72967211161d58e", dest = "scripts/comment_ratchet.py" }
dead_code_ratchet = { src = "scripts/dead_code_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/dead_code_ratchet.py" }
conventions_ratchet = { src = "scripts/conventions_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/conventions_ratchet.py" }
runtime_write_ratchet = { src = "scripts/runtime_write_ratchet.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/runtime_write_ratchet.py" }
runtime_write_resolve = { src = "scripts/runtime_write_resolve.py", sha = "5505185c5f4b10eea5ab268e7b6676c6c54340c4", dest = "scripts/runtime_write_resolve.py" }

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage.
# scripts/verify-before-ship.ps1 runs scripts/structure_ratchet.py, which fails when a
# new file passes 1,000 lines, a new function 100 lines or a flat directory 40 modules,
# when a baselined offender grows past its size in .structure-ratchet-baseline.json,
# and when the root folders do not match `shape` plus `extra_roots`. Existing
# offenders are baselined at today's size, never excluded. Exit 3 (git unusable, an
# unparseable file, an unknown shape) fails the gate. Procedure: project-scaffolding
# docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet stage for the deterministic
# rules of the weekly prompt audit, run over CLAUDE.md and AGENTS.md (this repo ships no
# skills or rules files). scripts/verify-before-ship.ps1 runs scripts/instruction_ratchet.py,
# which fails when a violation-cap hit count rises above .instruction-ratchet-baseline.json
# or a file passes its size cap. Existing hits are baselined at today's count, never
# excluded. Exit 3 (git unusable, an unreadable file) fails the gate. Procedure:
# project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet stage for stale documentation
# references. scripts/verify-before-ship.ps1 runs scripts/doc_refs_ratchet.py, which fails
# when README.md, CLAUDE.md or docs/**/*.md names a repo path, relative link or module that
# does not exist and .doc-refs-ratchet-baseline.json does not already record it. The site
# declares no `port`, so loopback ports in the docs are not checked. Existing dangling
# references are baselined at today's count, never excluded. Exit 3 (git unusable, a file
# that is not UTF-8) fails the gate. Procedure: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled  = true
baseline = ".doc-refs-ratchet-baseline.json"

# [static_ratchet] -- the scaffold's baseline-and-ratchet stage for duplicated code. The site
# ships no Python, so ruff finds nothing to report; jscpd (pinned, run through npx) checks
# the JavaScript for exact clones. scripts/verify-before-ship.ps1 runs
# scripts/static_ratchet.py, which fails on a finding .static-ratchet-baseline.json does
# not already record. The vendored scripts are excluded automatically. Existing findings are
# baselined at today's count, never excluded. Exit 3 (no Node, no network on the first npx,
# ruff missing, an unparseable report) fails the gate. Procedure: project-scaffolding
# docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"

# [docs_ratchet] -- the scaffold's baseline-and-ratchet stage for the README and docs convention.
# scripts/verify-before-ship.ps1 runs scripts/docs_ratchet.py, which fails when README.md
# passes its size budget or README.md or docs/**/*.md carries more history markers (an issue
# reference, a dated or changelog heading) than .docs-ratchet-baseline.json records. Existing
# markers are baselined at today's count, never excluded. Exit 3 (git unusable, a file that is
# not UTF-8, a fence or comment that never closes) fails the gate. Procedure:
# project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [comment_ratchet] -- the scaffold's baseline-and-ratchet stage for history comments.
# scripts/verify-before-ship.ps1 runs scripts/comment_ratchet.py, which fails when a
# JavaScript, CSS or PowerShell file carries more issue references (#NNN) in its comments
# than .comment-ratchet-baseline.json records. Existing references are baselined at
# today's count, never excluded. Exit 3 (git unusable, a file that cannot be scanned)
# fails the gate. Procedure: project-scaffolding docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet stage for definitions nothing
# references. The site ships no Python of its own: the only tracked .py files are the vendored
# ratchet scripts, which are read for references and never reported, so the stage guards
# against the first uncalled Python helper landing in scripts/. scripts/verify-before-ship.ps1
# runs scripts/dead_code_ratchet.py, which fails on a dead definition
# .dead-code-ratchet-baseline.json does not already record. Exit 3 (git unusable, a tracked
# .py file that does not parse) fails the gate. Procedure: project-scaffolding
# docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet stage for fleet conventions held
# as Python rules. The site ships no Python of its own (the vendored ratchet scripts are
# excluded through [vendored]), so the stage guards the first helper that lands in scripts/.
# no-window: the gate runs on Windows, where a subprocess spawn must suppress the console
# window. no-drive-path: no hardcoded drive paths. Left out: logging-not-print (it scans app/
# and src/, which a static site does not have), secret-compare and git-wrapper (the repo has
# no such helper). scripts/verify-before-ship.ps1 runs scripts/conventions_ratchet.py, which
# fails when a file carries more hits of a rule than .conventions-ratchet-baseline.json
# records. Exit 3 (git unusable, a tracked .py file that does not parse) fails the gate.
# Procedure: project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled  = true
baseline = ".conventions-ratchet-baseline.json"
rules    = ["no-window", "no-drive-path"]

# [runtime_write_ratchet] -- scripts/runtime_write_ratchet.py fails when a tracked
# Python file gains a write target (open for writing, Path.write_*, mkdir, a log
# FileHandler, sqlite3.connect, a copy destination) whose path resolves under a code
# folder, beyond .runtime-write-ratchet-baseline.json; a new target it cannot resolve
# is "not confirmed" (exit 3), never clean. The same script brackets the test stages
# (--snapshot before, --probe after) and fails on any untracked or ignored file the
# run left under a code folder. Mechanism: project-scaffolding docs/runtime-write-ratchet.md.
[runtime_write_ratchet]
enabled  = true
baseline = ".runtime-write-ratchet-baseline.json"
